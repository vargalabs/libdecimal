name: CI

on:
  push:
    branches: [release, staging]
  pull_request:
    branches: [release, staging]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Opt into the Node 24 runtime for JavaScript actions (default flips 2026-06-02).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-13
            compiler-version: 13
          - os: ubuntu-22.04
            compiler: gcc-14
            compiler-version: 14
          - os: ubuntu-24.04
            compiler: gcc-13
            compiler-version: 13
          - os: ubuntu-24.04
            compiler: gcc-14
            compiler-version: 14
            artifact: true
          - os: ubuntu-24.04
            compiler: clang-18
            compiler-version: 18
          - os: ubuntu-24.04
            compiler: clang-19
            compiler-version: 19
          - os: ubuntu-24.04
            compiler: clang-20
            compiler-version: 20
          # Apple-Silicon runner, but cross-targets x86_64 (the only architecture
          # Intel's DPML float128 sources support) and runs the tests via
          # Rosetta 2. Native arm64 would require an aarch64 DPML port.
          - os: macos-14
            compiler: apple-clang
            compiler-version: native
            cmake-extra: "-DCMAKE_OSX_ARCHITECTURES=x86_64"
            artifact: true
          - os: windows-latest
            compiler: msvc
            compiler-version: native
            artifact: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------- Linux
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup GCC (Linux)
        if: runner.os == 'Linux' && startsWith(matrix.compiler, 'gcc-')
        shell: bash
        run: |
          set -euxo pipefail
          version="${{ matrix.compiler-version }}"
          if ! command -v "gcc-${version}" >/dev/null; then
            sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
            sudo apt-get update
            sudo apt-get install -y "gcc-${version}" "g++-${version}"
          fi
          echo "CC=$(command -v gcc-${version})" >> "$GITHUB_ENV"
          echo "CXX=$(command -v g++-${version})" >> "$GITHUB_ENV"
          g++-"${version}" --version

      - name: Setup Clang (Linux)
        if: runner.os == 'Linux' && startsWith(matrix.compiler, 'clang-')
        shell: bash
        run: |
          set -euxo pipefail
          version="${{ matrix.compiler-version }}"
          if ! command -v "clang-${version}" >/dev/null; then
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
            sudo DISTRIB_CODENAME="$codename" ./llvm.sh "${version}"
          fi
          echo "CC=$(command -v clang-${version})" >> "$GITHUB_ENV"
          echo "CXX=$(command -v clang++-${version})" >> "$GITHUB_ENV"
          clang++-"${version}" --version

      # ---------------------------------------------------------------- macOS
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          # Ensure Rosetta 2 is present so the cross-built x86_64 tests can run.
          softwareupdate --install-rosetta --agree-to-license || true
          brew install --quiet ninja || true
          echo "CC=$(xcrun --find clang)" >> "$GITHUB_ENV"
          echo "CXX=$(xcrun --find clang++)" >> "$GITHUB_ENV"
          "$(xcrun --find clang++)" --version

      # ---------------------------------------------------------------- Windows
      - name: Setup MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y --no-progress

      # -------------------------------------------------------- configure/build
      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dlibdecimal_BUILD_DOCS=OFF \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            ${{ matrix.cmake-extra }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dlibdecimal_BUILD_DOCS=OFF \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      # Validate the install rules and publish the install tree (headers +
      # libdecimal CMake package + Intel LIBBID static library) per platform.
      - name: Install
        if: matrix.artifact
        shell: bash
        run: |
          set -euxo pipefail
          cmake --install build --config Release --prefix "${RUNNER_TEMP}/libdecimal-install"
          find "${RUNNER_TEMP}/libdecimal-install" -type f | sort

      - name: Upload install artifact
        if: matrix.artifact
        uses: actions/upload-artifact@v4
        with:
          name: libdecimal-install-${{ matrix.os }}-${{ matrix.compiler }}
          path: ${{ runner.temp }}/libdecimal-install
          if-no-files-found: error

      - name: Record badge status
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p badge-status
          cat <<EOF > "badge-status/status-${{ matrix.os }}-${{ matrix.compiler }}.json"
          {
            "os": "${{ matrix.os }}",
            "compiler": "${{ matrix.compiler }}",
            "status": "${{ job.status }}"
          }
          EOF

      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ matrix.os }}-${{ matrix.compiler }}
          path: badge-status/status-${{ matrix.os }}-${{ matrix.compiler }}.json

  # Guards the MSVC code path (portable math::uint128 struct) on a fast Linux
  # runner by forcing the struct even where the __int128 builtin exists.
  portable-uint128:
    name: portable-uint128 / ubuntu-24.04 / gcc-14
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-14 g++-14
      - name: Configure (forced portable uint128)
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dlibdecimal_BUILD_DOCS=OFF \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_CXX_FLAGS="-DDECIMAL_FORCE_PORTABLE_UINT128=1"
      - name: Build
        shell: bash
        run: cmake --build build --parallel
      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: sanitizers / ubuntu-24.04 / clang-19
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          if ! command -v clang-19 >/dev/null; then
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
            sudo DISTRIB_CODENAME="$codename" ./llvm.sh 19
          fi
      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -Dlibdecimal_BUILD_DOCS=OFF \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19
      - name: Build
        shell: bash
        run: cmake --build build --parallel
      - name: Test (ASan + UBSan)
        shell: bash
        run: ctest --test-dir build --output-on-failure --parallel

  coverage:
    name: coverage / ubuntu-24.04 / gcc-14
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc-14
      CXX: g++-14
      GCOV: gcov-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-14 g++-14 lcov
      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -Dlibdecimal_BUILD_DOCS=OFF \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_FLAGS="--coverage -O0 -g" \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
      - name: Build
        shell: bash
        run: cmake --build build --parallel
      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure --parallel
      - name: Capture coverage
        shell: bash
        run: |
          set -euxo pipefail
          lcov --gcov-tool /usr/bin/gcov-14 --rc geninfo_unexecuted_blocks=1 \
            --ignore-errors mismatch --directory build --capture --output-file coverage.full.info
          lcov --gcov-tool /usr/bin/gcov-14 --remove coverage.full.info \
            '/usr/*' '*/test/*' '*/thirdparty/*' --ignore-errors unused --output-file coverage.info
          rm coverage.full.info
          lcov --gcov-tool /usr/bin/gcov-14 --list coverage.info
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.info
          disable_search: true
          fail_ci_if_error: false
          disable_telem: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  badge:
    name: Generate SVG Badges
    if: always()
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: Install badge tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y jq curl
      - name: Download all status artifacts
        uses: actions/download-artifact@v4
        with:
          path: badge-status
          pattern: status-*
          merge-multiple: true
      - name: Generate SVG Badges
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${GITHUB_REF_NAME:-}" == "staging" ]]; then
            badge_dir="badges-staging"
          else
            badge_dir="badges"
          fi
          mkdir -p "$badge_dir"
          for status_file in badge-status/*.json; do
            [[ -f "$status_file" ]] || continue
            os=$(jq -r '.os' "$status_file")
            compiler=$(jq -r '.compiler' "$status_file")
            status=$(jq -r '.status' "$status_file")
            prefix="unknown"; symbol="%3F"; color="lightgrey"
            case "$status" in
              success)   prefix="ok";        symbol="%E2%9C%94"; color="green"  ;;
              failure)   prefix="failed";    symbol="%E2%9C%98"; color="red"    ;;
              cancelled) prefix="cancelled"; symbol="%E2%97%87"; color="yellow" ;;
              skipped)   prefix="na";        symbol="%E2%97%8B"; color="gray"   ;;
            esac
            badge="$badge_dir/${os}-${compiler}.svg"
            curl -fsSL "https://img.shields.io/badge/${prefix}-${symbol}-${color}.svg" -o "$badge"
          done
      - name: Upload badges artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'staging' && 'badges-staging' || 'badges' }}
          path: ${{ github.ref_name == 'staging' && 'badges-staging' || 'badges' }}
      - name: Deploy badges to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./${{ github.ref_name == 'staging' && 'badges-staging' || 'badges' }}
          destination_dir: ${{ github.ref_name == 'staging' && 'badges-staging' || 'badges' }}
          keep_files: true
