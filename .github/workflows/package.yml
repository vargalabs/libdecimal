name: Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux-x86_64
          - os: macos-14
            name: macOS-x86_64
            cmake-extra: "-DCMAKE_OSX_ARCHITECTURES=x86_64"
          - os: windows-latest
            name: Windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          brew install --quiet ninja || true
          echo "CC=$(xcrun --find clang)" >> "$GITHUB_ENV"
          echo "CXX=$(xcrun --find clang++)" >> "$GITHUB_ENV"

      - name: Setup MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cc=cl; cxx=cl
          else
            cc="$CC"; cxx="$CXX"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$cc" \
            -DCMAKE_CXX_COMPILER="$cxx" \
            -Dlibdecimal_BUILD_TESTS=OFF \
            -Dlibdecimal_BUILD_DOCS=OFF \
            ${{ matrix.cmake-extra }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Install
        shell: bash
        run: |
          set -euxo pipefail
          prefix="${RUNNER_TEMP}/pkg/libdecimal-${{ steps.ver.outputs.version }}"
          cmake --install build --config Release --prefix "$prefix"
          find "$prefix" -type f | sort

      - name: Archive (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          name="libdecimal-${{ steps.ver.outputs.version }}-${{ matrix.name }}"
          tar czf "${name}.tar.gz" -C "${RUNNER_TEMP}/pkg" "libdecimal-${{ steps.ver.outputs.version }}"
          ls -la "${name}.tar.gz"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "libdecimal-${{ steps.ver.outputs.version }}-${{ matrix.name }}"
          Compress-Archive -Path "$env:RUNNER_TEMP\pkg\libdecimal-${{ steps.ver.outputs.version }}" -DestinationPath "$name.zip"
          Get-Item "$name.zip"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: libdecimal-${{ matrix.name }}
          path: |
            libdecimal-*.tar.gz
            libdecimal-*.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [package]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: libdecimal-*
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${{ github.repository }}"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber --repo "$repo"
          else
            gh release create "$tag" artifacts/* \
              --title "libdecimal ${tag}" \
              --generate-notes \
              --repo "$repo"
          fi
