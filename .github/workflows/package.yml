name: Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-linux:
    name: ${{ matrix.os }} / x86_64 / tarball
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-14 g++-14

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_INSTALL_PREFIX=/tmp/libdecimal-install \
            -Dlibdecimal_BUILD_TESTS=OFF \
            -Dlibdecimal_BUILD_DOCS=OFF

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Install
        shell: bash
        run: cmake --install build --prefix /tmp/libdecimal-install

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          version="${GITHUB_REF_NAME#v}"
          tar czf "libdecimal-${version}-Linux-x86_64.tar.gz" -C /tmp libdecimal-install

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libdecimal-linux-x86_64
          path: libdecimal-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [package-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: libdecimal-*
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${{ github.repository }}"

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber --repo "$repo"
          else
            gh release create "$tag" artifacts/* \
              --title "libdecimal ${tag}" \
              --generate-notes \
              --repo "$repo"
          fi
